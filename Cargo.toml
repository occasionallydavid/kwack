[package]
name = "kwack"
version = "0.7.0"
edition = "2024"
resolver = "3"
license = "Apache-2.0"
keywords = ["quic", "mtls", "rustls", "ed25519"]
categories = ["cryptography", "network-programming"]
readme = "README.md"
description = "Ed25519 key-based mutual TLS for rustls, Tower, and reqwest"
documentation = "https://docs.rs/kwack"
repository = "https://github.com/occasionallydavid/kwack"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }

axum = { version = "0.8", default-features = false, optional = true }
h3 = { version = "0.0.8", default-features = false, optional = true }
h3-quinn = { version = "0.0.10", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["http3"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"], optional = true }

bytes = { version = "1", default-features = false, optional = true }
http = { version = "1", default-features = false, optional = true }
http-body = { version = "1", default-features = false, optional = true }
http-body-util = { version = "0.1", default-features = false, optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }

[features]
server = [
    "dep:bytes", "dep:h3", "dep:h3-quinn", "dep:http", "dep:http-body",
    "dep:http-body-util", "dep:quinn", "dep:tokio", "dep:tower", "rustls/ring",
]
axum = ["server", "dep:axum"]
reqwest = ["dep:reqwest", "rustls/ring"]

[profile.production]
inherits = "release"
codegen-units = 1
opt-level = "z"  # Optimize for size.
lto = "fat"
strip = true  # Automatically strip symbols from the binary.
panic = "abort"

[dev-dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[[example]]
name = "client"
required-features = ["reqwest"]

[[example]]
name = "server"
required-features = ["axum"]
