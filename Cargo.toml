[package]
name = "kwack"
version = "0.7.0"
edition = "2024"
resolver = "3"
license = "Apache-2.0"
keywords = ["quic", "mtls", "rustls", "ed25519"]
categories = ["cryptography", "network-programming"]
readme = "README.md"
description = "Ed25519 certificates and public-key allowlists for rustls and QUIC"
documentation = "https://docs.rs/kwack"
repository = "https://github.com/occasionallydavid/quic_wg"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }

[profile.production]
inherits = "release"
codegen-units = 1
opt-level = "z"  # Optimize for size.
lto = "fat"
strip = true  # Automatically strip symbols from the binary.
panic = "abort"

[dev-dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
