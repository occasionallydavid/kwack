[package]
name = "quic_wg"
version = "0.5.0"
edition = "2024"
resolver = "3"
license = "MIT OR Apache-2.0"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
description = "Authenticated QUIC streams and HTTP over userspace WireGuard"

[dependencies]
bytes = { version = "1", default-features = false }
quinn-proto = { version = "0.11.8", default-features = false, features = ["ring"] }
tracing = { version = "0.1", default-features = false }
boringtun = { version = "0.7.1", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "sync", "time"] }
http = { version = "1", default-features = false, optional = true }
tower-service = { version = "0.3", default-features = false, optional = true }
hyper = { version = "1", default-features = false, features = ["http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false }
parking_lot = { version = "0.12", default-features = false }

tokio-util = { version = "0.7", default-features = false }
ring = { version = "0.17", default-features = false }

[features]
default = ["http"]
http = ["http-client", "http-server", "bridge"]
http-client = ["dep:http", "dep:hyper", "hyper/client", "dep:hyper-util", "dep:http-body-util"]
http-server = ["dep:http", "dep:tower-service", "dep:hyper", "hyper/server", "dep:hyper-util", "hyper-util/service"]
bridge = ["tokio/io-util"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "signal"] }
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
reqwest = { version = "0.13", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[example]]
name = "server"
required-features = ["http-server"]

[[example]]
name = "client"
required-features = ["http-client"]

[[example]]
name = "reqwest"
required-features = ["bridge"]
