[package]
name = "wireguard-quic"
version = "0.5.0"
edition = "2021"
resolver = "2"
license = "MIT OR Apache-2.0"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
description = "Authenticated QUIC streams and HTTP over userspace WireGuard"

[dependencies]
bytes = "1"
quinn-proto = { version = "0.11.8", default-features = false, features = ["ring"] }
tracing = "0.1"
seahash = "4.1.0"
boringtun = { version = "0.7.1", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
axum = { version = "0.8", optional = true }
hyper = { version = "1", features = ["client", "server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
http-body-util = { version = "0.1", optional = true }
base64 = "0.22"
zeroize = "1"
parking_lot = "0.12"

tokio-util = { version = "0.7", features = ["rt"] }
ring = "0.17"

[features]
default = ["http"]
http = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false }
rcgen = "0.14"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[example]]
name = "server"
required-features = ["http"]

[[example]]
name = "client"
required-features = ["http"]

[[example]]
name = "reqwest"
required-features = ["http"]
